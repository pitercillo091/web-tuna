<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../"><title>Revisión de personajes · Una ronda más</title>
<style>body{margin:0;background:#201d2a;color:#f0dfc7;font:15px system-ui}main{max-width:1150px;margin:auto;padding:28px}h1{font:34px Georgia;margin:0 0 12px}p{color:#c9b9c3;line-height:1.7}nav{display:flex;gap:14px;flex-wrap:wrap;margin:20px 0}button,select{font:inherit;color:#f5d299;background:#3b2c3d;padding:10px 15px;border:1px solid #82664b;border-radius:7px}canvas{display:block;width:100%;height:auto;border-radius:14px;background:#242133;image-rendering:pixelated}#cast{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}figure{margin:22px 0;width:175px;text-align:center}figure img{width:144px;height:240px;object-fit:contain;image-rendering:pixelated}figcaption{line-height:1.8;font-size:12px}#status{color:#e8c884}a{color:#ecc685}</style>
<main><h1>Los cinco personajes de tus imágenes</h1><p>Esta vista utiliza el dibujado real del juego. Solo cambia la pose mostrada; no toca partidas, controles ni guardados.</p><nav><select id="pose" aria-label="Animación"><option value="idle">Reposo</option><option value="walk">Caminar</option><option value="playing">Actuación</option><option value="victory">Victoria</option></select><button id="fallback">Probar respaldo SVG</button><button id="freeze">Detener animación</button></nav><p id="status" role="status">Cargando cinco atlas…</p><canvas id="preview" width="960" height="540" aria-label="Los cinco personajes animados en la plaza"></canvas><section id="cast" aria-label="Bases originales"></section><p><a href="index.html">Abrir el juego →</a> · <a href="assets/personajes/comparacion-reparto.png">Ver los recortes juntos</a></p></main>
<script src="src/songs.js"></script><script src="src/midi.js"></script><script src="src/data.js"></script><script src="src/engine.js"></script><script src="src/art.js"></script><script>
'use strict';
const canvas=document.getElementById('preview'),art=new TunaArt(canvas),pose=document.getElementById('pose'),status=document.getElementById('status');let fallback=false,frozen=false,time=0,last=performance.now(),stored={};
TunaData.characters.forEach(c=>{const figure=document.createElement('figure'),im=document.createElement('img'),caption=document.createElement('figcaption');im.src='assets/personajes/'+c.id+'.svg';im.alt=c.name;caption.textContent=c.name+' · '+c.id;figure.append(im,caption);document.getElementById('cast').append(figure);});
function report(){const ready=TunaData.characters.filter(c=>art.images[c.id]&&(fallback||art.images[c.id+'-atlas']?.naturalWidth===768)).length;status.textContent=ready===5?`5 personajes cargados · ${pose.selectedOptions[0].textContent} · ${fallback?'respaldo SVG':'atlas PNG'}`:`Cargando… ${ready}/5`;document.body.dataset.loaded=ready;document.body.dataset.pose=pose.value;document.body.dataset.fallback=fallback;}
pose.addEventListener('change',report);
document.getElementById('fallback').onclick=()=>{fallback=!fallback;TunaData.characters.forEach(c=>{const key=c.id+'-atlas';if(fallback){stored[key]=art.images[key];art.images[key]=null;}else art.images[key]=stored[key];});report();};
document.getElementById('freeze').onclick=e=>{frozen=!frozen;e.target.textContent=frozen?'Reanudar animación':'Detener animación';};
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(!frozen)time+=dt;art.resize();art.time=time;art.scene('plaza');TunaData.characters.forEach((c,i)=>{art.character(c.id,100+i*190,445,1.6,pose.value,1);art.text(c.name,100+i*190,487,16);});report();requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
