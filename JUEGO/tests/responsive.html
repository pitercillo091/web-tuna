<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prueba responsive · Una ronda más</title>
<style>body{margin:0;background:#11121c;color:#e8d4b6;font:13px system-ui}header{padding:14px 24px;display:flex;align-items:center;gap:15px;flex-wrap:wrap}button{background:#e8bd7e;color:#322339;border:0;padding:10px 15px;border-radius:6px;cursor:pointer}iframe{display:block;margin:12px auto;border:1px solid #b9946644;width:390px;height:844px;max-width:calc(100vw - 24px);background:#181720}</style>
<header><b>Revisión responsive</b><button data-width="390" data-height="844">Móvil vertical · 390 × 844</button><button data-width="844" data-height="390">Móvil horizontal · 844 × 390</button><button data-width="1200" data-height="850">Escritorio · 1200 × 850</button><button id="home">Inicio y personajes</button><button id="garden">Escenario de la isa</button><button id="final">Actuación con seis teclas</button><button id="check">Comprobar distribución</button><span id="report" role="status"></span></header>
<iframe id="preview" src="../index.html?v=2#qa" title="Juego en la vista responsive"></iframe><script>
const f=document.getElementById('preview');document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>{f.style.width=b.dataset.width+'px';f.style.height=b.dataset.height+'px';});
document.getElementById('home').onclick=()=>{f.contentDocument.getElementById('brand').click();f.contentWindow.TunaQA.step(0);};
function scene(level,rhythm){const w=f.contentWindow,q=w.TunaQA;q.save.music=false;q.save.effects=false;q.audio.stop();q.start(level);f.contentDocument.querySelector('[data-action="begin"]').click();if(rhythm)q.game.startRhythm();q.step(0);if(rhythm)for(let i=0;i<300;i++)q.step(.01);q.step(0);}
document.getElementById('garden').onclick=()=>scene(6,false);document.getElementById('final').onclick=()=>scene(9,true);
document.getElementById('check').onclick=()=>{const d=f.contentDocument,w=f.contentWindow,buttons=Array.from(d.querySelectorAll('[data-lane],[data-direction],#interact')),visible=buttons.filter(b=>b.getBoundingClientRect().height>0),ok=d.documentElement.scrollWidth<=w.innerWidth+1&&visible.every(b=>{const r=b.getBoundingClientRect();return r.width>=44&&r.height>=44&&r.left>=0&&r.right<=w.innerWidth+1&&r.bottom<=w.innerHeight;});document.getElementById('report').textContent=(ok?'PASS':'FAIL')+' · sin desbordamiento, controles visibles de 44 px';document.body.dataset.layout=ok?'pass':'fail';};
</script></html>
